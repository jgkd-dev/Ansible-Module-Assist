name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ansible + test collections
        run: |
          pip install ansible-core
          ansible-galaxy collection install ansible.posix pfsensible.core
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package --no-dependencies --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
