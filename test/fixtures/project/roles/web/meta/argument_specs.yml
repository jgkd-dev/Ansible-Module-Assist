argument_specs:
  main:
    short_description: Installs the C(nginx) web server
    options:
      web_port:
        type: int
        required: true
        description: Port to listen on
      web_tls:
        type: dict
        options:
          cert:
            type: path
  install:
    short_description: Installs packages only
    options:
      install_method:
        type: str
        required: true
        choices: [package, source]
